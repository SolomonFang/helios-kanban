name: Release (multi-platform npm)

# Publishes a small npm wrapper package (~100 KB) plus one npm package per
# platform (helios-kanban-<platform>, wired as optionalDependencies) holding
# that platform's zipped binaries — installs download no binaries at runtime
# (npm rejects ~280MB all-in-one tarballs). The same zips are also attached
# to the GitHub Release as a fallback download source for the wrapper.
#
# Trigger manually from Actions tab. Choose version bump or pass "skip"
# to publish the version currently in npx-cli/package.json.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump in npx-cli/package.json"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - skip
      dry_run:
        description: "Dry run: build & pack, skip publish + tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-multi-platform
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.13.1"
  RUST_TOOLCHAIN: "nightly-2025-12-04"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bump version
        id: bump
        run: |
          cd npx-cli
          if [ "${{ inputs.version_bump }}" != "skip" ]; then
            npm version "${{ inputs.version_bump }}" --no-git-tag-version
          fi
          new_version=$(node -p "require('./package.json').version")
          new_tag="v${new_version}"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.version_bump }}" = "skip" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${new_tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        if: ${{ inputs.version_bump != 'skip' && !inputs.dry_run }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add npx-cli/package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.new_tag }}"
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push
          git push --tags

  build-frontend:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter ./frontend run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # Linux-only matrix. macOS Intel + Apple Silicon are built in one macos-14 job
  # so we avoid macos-13 (Intel-hosted) runner queues which often sit "Waiting...".
  build-backend-linux:
    needs: [bump-version, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake nasm ninja-build pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Build binaries
        shell: bash
        env:
          # Match local-build.sh defaults so embedded URLs work the same.
          VK_SHARED_API_BASE: "https://api.vibekanban.com"
          VITE_VK_SHARED_API_BASE: "https://api.vibekanban.com"
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            --bin server --bin mcp_task_server --bin review

      - name: Package zips
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/${{ matrix.name }}"
          mkdir -p "$OUT"
          BIN_DIR="target/${{ matrix.target }}/release"

          cp "$BIN_DIR/server"          vibe-kanban
          cp "$BIN_DIR/mcp_task_server" vibe-kanban-mcp
          cp "$BIN_DIR/review"          vibe-kanban-review

          zip -q "$OUT/vibe-kanban.zip"        vibe-kanban
          zip -q "$OUT/vibe-kanban-mcp.zip"    vibe-kanban-mcp
          zip -q "$OUT/vibe-kanban-review.zip" vibe-kanban-review

          rm -f vibe-kanban vibe-kanban-mcp vibe-kanban-review
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 1

  build-backend-macos:
    needs: [bump-version, build-frontend]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos-both-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos-both-

      - name: Build and package (macos-x64 + macos-arm64)
        shell: bash
        env:
          VK_SHARED_API_BASE: "https://api.vibekanban.com"
          VITE_VK_SHARED_API_BASE: "https://api.vibekanban.com"
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          build_and_zip() {
            local target="$1"
            local name="$2"
            local dep_target="$3"
            export MACOSX_DEPLOYMENT_TARGET="$dep_target"
            cargo build --release --target "$target" \
              --bin server --bin mcp_task_server --bin review
            local out="dist/${name}"
            mkdir -p "$out"
            local bin_dir="target/${target}/release"
            cp "$bin_dir/server"          vibe-kanban
            cp "$bin_dir/mcp_task_server" vibe-kanban-mcp
            cp "$bin_dir/review"          vibe-kanban-review
            zip -q "$out/vibe-kanban.zip"        vibe-kanban
            zip -q "$out/vibe-kanban-mcp.zip"    vibe-kanban-mcp
            zip -q "$out/vibe-kanban-review.zip" vibe-kanban-review
            rm -f vibe-kanban vibe-kanban-mcp vibe-kanban-review
            ls -lh "$out"
          }

          build_and_zip x86_64-apple-darwin macos-x64 10.12
          build_and_zip aarch64-apple-darwin macos-arm64 11.0

      - uses: actions/upload-artifact@v4
        with:
          name: backend-macos-x64
          path: dist/macos-x64/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: backend-macos-arm64
          path: dist/macos-arm64/
          if-no-files-found: error
          retention-days: 1

  # Windows x64 only (GitHub-hosted ARM64 Windows is not generally available).
  build-backend-windows:
    needs: [bump-version, build-frontend]
    runs-on: windows-latest
    env:
      VK_SHARED_API_BASE: "https://api.vibekanban.com"
      VITE_VK_SHARED_API_BASE: "https://api.vibekanban.com"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-windows-x64-

      - name: Build binaries
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc `
            --bin server --bin mcp_task_server --bin review

      - name: Package zips
        shell: pwsh
        run: |
          $binDir = "target/x86_64-pc-windows-msvc/release"
          $outRoot = "dist/windows-x64"
          New-Item -ItemType Directory -Force -Path $outRoot | Out-Null

          @(
            @{ Src = "server.exe"; BinName = "vibe-kanban"; Zip = "vibe-kanban.zip" },
            @{ Src = "mcp_task_server.exe"; BinName = "vibe-kanban-mcp"; Zip = "vibe-kanban-mcp.zip" },
            @{ Src = "review.exe"; BinName = "vibe-kanban-review"; Zip = "vibe-kanban-review.zip" }
          ) | ForEach-Object {
            $staging = "./$($_.BinName).exe"
            Copy-Item "$binDir/$($_.Src)" -Destination $staging
            $zipPath = Join-Path $outRoot $_.Zip
            if (Test-Path $zipPath) { Remove-Item $zipPath }
            Compress-Archive -LiteralPath $staging -DestinationPath $zipPath
            Remove-Item $staging
          }
          Get-ChildItem $outRoot

      - uses: actions/upload-artifact@v4
        with:
          name: backend-windows-x64
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [bump-version, build-backend-linux, build-backend-macos, build-backend-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.ref }}

      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          always-auth: true

      # Run early so auth is checked even if a later step fails. Uses the workflow
      # file from the branch you select when clicking "Run workflow" (not Re-run).
      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty in this job."
            echo "If the secret lives under an Environment, add 'environment: <name>' to the publish job."
            echo "Re-running an old workflow run uses the OLD workflow file — trigger a new run instead."
            exit 1
          fi
          echo "registry=$(npm config get registry)"
          npm whoami
          npm view helios-kanban version

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts/

      # One npm package per platform (esbuild-style). The `os`/`cpu` fields
      # make npm install only the package matching the user's machine.
      - name: Build per-platform npm packages
        shell: bash
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const PLATFORMS = {
            "linux-x64": { os: "linux", cpu: "x64" },
            "linux-arm64": { os: "linux", cpu: "arm64" },
            "macos-x64": { os: "darwin", cpu: "x64" },
            "macos-arm64": { os: "darwin", cpu: "arm64" },
            "windows-x64": { os: "win32", cpu: "x64" },
          };

          for (const [platformDir, target] of Object.entries(PLATFORMS)) {
            const artifacts = path.join("artifacts", `backend-${platformDir}`);
            if (!fs.existsSync(artifacts)) {
              console.log(`skip ${platformDir}: no artifacts`);
              continue;
            }
            const pkgDir = path.join("platform-packages", `helios-kanban-${platformDir}`);
            fs.mkdirSync(pkgDir, { recursive: true });
            for (const f of fs.readdirSync(artifacts)) {
              if (f.endsWith(".zip")) {
                fs.copyFileSync(path.join(artifacts, f), path.join(pkgDir, f));
              }
            }
            const pkg = {
              name: `helios-kanban-${platformDir}`,
              version: process.env.NEW_VERSION,
              description: `Prebuilt helios-kanban binaries for ${target.os} ${target.cpu}`,
              repository: {
                type: "git",
                url: "git+https://github.com/SolomonFang/vibe-kanban.git",
              },
              os: [target.os],
              cpu: [target.cpu],
              files: ["*.zip"],
            };
            fs.writeFileSync(
              path.join(pkgDir, "package.json"),
              JSON.stringify(pkg, null, 2) + "\n"
            );
            console.log(`packed ${pkg.name}@${pkg.version}`);
          }
          NODE
          ls -lh platform-packages/*/

      - name: Prepare GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for d in artifacts/backend-*; do
            platform="${d#artifacts/backend-}"
            for z in "$d"/*.zip; do
              base=$(basename "$z" .zip)
              cp "$z" "release-assets/${platform}-${base}.zip"
            done
          done
          echo "Release assets:"
          ls -lh release-assets

      # npm rejects tarball uploads > ~100MB; the zips stay on the GitHub
      # Release as a fallback download source for platforms without an npm
      # platform package (e.g. windows-arm64).
      - name: Create GitHub Release and upload binaries
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          name: ${{ needs.bump-version.outputs.new_tag }}
          generate_release_notes: true
          allowUpdates: true
          fail_on_unmatched_files: true
          files: release-assets/*.zip

      - name: Point CLI at release assets (npm package)
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.bump-version.outputs.new_tag }}
        run: |
          set -euo pipefail
          sed -i "s|__RELEASE_ASSET_BASE__|${RELEASE_BASE}|g" npx-cli/bin/download.js
          grep -q "releases/download" npx-cli/bin/download.js ||
            { echo "sed failed"; exit 1; }

      - name: Shrink npm package and wire platform optionalDependencies
        shell: bash
        env:
          NEW_VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          set -euo pipefail
          rm -rf npx-cli/dist
          node <<'NODE'
          const fs = require("fs");
          const dir = "./npx-cli/package.json";
          const p = JSON.parse(fs.readFileSync(dir, "utf8"));
          p.files = ["bin", "README.md"];
          // Pin the platform packages built in this run so npm installs the
          // matching binaries automatically (skipped on other platforms).
          p.optionalDependencies = Object.fromEntries(
            fs
              .readdirSync("./platform-packages")
              .map((name) => [name, process.env.NEW_VERSION])
          );
          fs.writeFileSync(dir, JSON.stringify(p, null, 2) + "\n");
          NODE

      - name: Pack preview
        run: |
          cd npx-cli
          npm pack --dry-run

      # Platform packages go first so the wrapper's optionalDependencies
      # already resolve when it is published.
      - name: Publish platform packages to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for d in platform-packages/*/; do
            (cd "$d" && npm publish --access public --registry https://registry.npmjs.org)
          done

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npx-cli
          npm publish --access public --registry https://registry.npmjs.org
