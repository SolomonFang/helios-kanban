[workspace]
resolver = "3"
members = [
    "crates/api-types",
    "crates/server",
    "crates/db",
    "crates/executors",
    "crates/services",
    "crates/utils",
    "crates/git",
    "crates/local-deployment",
    "crates/deployment",
    "crates/review",
]
exclude = ["crates/remote"]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8.4", features = ["macros", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "request-id", "trace", "fs", "validate-request"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
git2 = { version = "0.20.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
thiserror = "2.0.12"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = { git = "https://github.com/xazukx/ts-rs.git", branch = "use-ts-enum", features = ["uuid-impl", "chrono-impl", "no-serde-warnings", "serde-json-impl"] }
schemars = { version = "1.0.4", features = ["derive", "chrono04", "uuid1", "preserve_order"] }
serde_with = "3"
async-trait = "0.1"

# Optimized for small download size (binaries ship via npm platform packages).
# fat LTO + single codegen unit costs CI build time; drop to lto = "thin"
# if release builds get too slow.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# Patches for codex's forked tokio-tungstenite/tungstenite with proxy support.
# codex-api 0.154 requires tungstenite with the `deflate`/`proxy` features, which
# only exist on codex's own forks, and tokio-tungstenite must re-export the same
# tungstenite so the types line up (mirrors codex-rs/Cargo.toml's patches).
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
# Vendored with small patches to support kimi's `elicitation/create` reverse-RPC
# (see the PATCH notes in each vendored crate). Remove once the upstream crate
# ships native elicitation support.
agent-client-protocol = { path = "vendor/agent-client-protocol" }
agent-client-protocol-schema = { path = "vendor/agent-client-protocol-schema" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
